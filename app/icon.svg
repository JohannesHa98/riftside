<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Riftside">
  <!--
    The Rift from above: one square split corner to corner by the river, blue
    side bottom left, red side top right. scripts/make-icons.mjs draws the
    same shape for the raster sizes, so the two must be changed together.
  -->
  <defs>
    <clipPath id="frame">
      <rect width="32" height="32" rx="7.04" />
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="32" height="32" fill="#0a0d13" />
    <path d="M-4 -4 L36 36 L-4 36 Z" fill="#4b8bf5" transform="translate(-1.7 1.7)" />
    <path d="M-4 -4 L36 -4 L36 36 Z" fill="#f2615c" transform="translate(1.7 -1.7)" />
    <path d="M-6 -6 L38 38" stroke="#c8aa6e" stroke-width="1.92" />
  </g>
</svg>
